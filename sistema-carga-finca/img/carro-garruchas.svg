<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Carro de garruchas: vista lateral y corte</title>
  <desc id="desc">Plano del carro que rueda sobre el cable portante. Dos placas de acero de 8 milímetros, de 560 por 320 milímetros, sostienen dos garruchas de 200 milímetros separadas 300 milímetros entre ejes. Debajo del cable hay pasadores que impiden que se salga. Abajo, al centro, un perno de carga sostiene un gancho giratorio con seguro. En cada extremo hay una oreja de tiro para el cable tractor.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#1E2A1F"/>
    </marker>
  </defs>
  <rect width="1000" height="1100" fill="#FFFFFF"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#1E2A1F">Carro de garruchas</text>
  <text x="30" y="64" font-size="14" fill="#55624F">Medidas en milímetros. Para cable portante de 5/8". Peso aproximado del carro: 30 kg.</text>

  <text x="30" y="110" font-size="16" font-weight="700" fill="#1E2A1F">Vista lateral</text>

  <!-- vista lateral: 1 mm = 0,8 px, origen en la esquina superior izquierda de la placa -->
  <g transform="translate(190 200) scale(0.8)">
    <!-- cable portante fuera de la placa, con cortes -->
    <rect x="-90" y="200" width="90" height="16" fill="#4A4F47"/>
    <rect x="560" y="200" width="90" height="16" fill="#4A4F47"/>
    <path d="M-90,196 l-8,8 l8,4 l-8,8 l8,4" fill="none" stroke="#4A4F47" stroke-width="2.5"/>
    <path d="M650,196 l8,8 l-8,4 l8,8 l-8,4" fill="none" stroke="#4A4F47" stroke-width="2.5"/>
    <!-- orejas de tiro -->
    <path d="M0,250 L-30,250 A30,30 0 0 0 -30,310 L0,310 Z" fill="#DDE3D6" stroke="#1E2A1F" stroke-width="2.5"/>
    <path d="M560,250 L590,250 A30,30 0 0 1 590,310 L560,310 Z" fill="#DDE3D6" stroke="#1E2A1F" stroke-width="2.5"/>
    <!-- placa -->
    <rect x="0" y="0" width="560" height="320" rx="30" fill="#DDE3D6" stroke="#1E2A1F" stroke-width="2.5"/>
    <circle cx="-30" cy="280" r="9" fill="#FFFFFF" stroke="#1E2A1F" stroke-width="2"/>
    <circle cx="590" cy="280" r="9" fill="#FFFFFF" stroke="#1E2A1F" stroke-width="2"/>
    <!-- garruchas ocultas -->
    <circle cx="130" cy="108" r="100" fill="none" stroke="#1E2A1F" stroke-width="2" stroke-dasharray="10 6"/>
    <circle cx="430" cy="108" r="100" fill="none" stroke="#1E2A1F" stroke-width="2" stroke-dasharray="10 6"/>
    <!-- cable oculto entre placas -->
    <line x1="0" y1="200" x2="560" y2="200" stroke="#4A4F47" stroke-width="2" stroke-dasharray="10 6"/>
    <line x1="0" y1="216" x2="560" y2="216" stroke="#4A4F47" stroke-width="2" stroke-dasharray="10 6"/>
    <!-- ejes con tuerca -->
    <polygon points="146,108 138,94 122,94 114,108 122,122 138,122" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="2"/>
    <polygon points="446,108 438,94 422,94 414,108 422,122 438,122" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="2"/>
    <circle cx="130" cy="108" r="10" fill="#FFFFFF" stroke="#1E2A1F" stroke-width="2"/>
    <circle cx="430" cy="108" r="10" fill="#FFFFFF" stroke="#1E2A1F" stroke-width="2"/>
    <!-- pasadores antidescarrilamiento -->
    <circle cx="130" cy="236" r="10" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="2"/>
    <circle cx="430" cy="236" r="10" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="2"/>
    <!-- perno de carga -->
    <circle cx="280" cy="282" r="14" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="2"/>
    <!-- gancho giratorio -->
    <rect x="266" y="322" width="28" height="34" rx="4" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="2"/>
    <path d="M280,356 L280,428 A34,34 0 0 0 348,428 L348,410" fill="none" stroke="#1E2A1F" stroke-width="12" stroke-linecap="round"/>
    <line x1="284" y1="396" x2="346" y2="406" stroke="#C2410C" stroke-width="4" stroke-linecap="round"/>
    <!-- grillete y cable tractor -->
    <path d="M586,268 C628,268 628,292 586,292" fill="none" stroke="#1E2A1F" stroke-width="5"/>
    <rect x="622" y="273" width="22" height="14" rx="3" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="2"/>
    <path d="M644,280 C680,284 700,292 730,300" fill="none" stroke="#C2410C" stroke-width="6"/>
    <!-- corte A-A -->
    <line x1="430" y1="-40" x2="430" y2="-10" stroke="#1E2A1F" stroke-width="2"/>
    <line x1="430" y1="330" x2="430" y2="360" stroke="#1E2A1F" stroke-width="2"/>
    <!-- cotas -->
    <g stroke="#1E2A1F" stroke-width="1.5">
      <line x1="130" y1="98" x2="130" y2="-62"/>
      <line x1="0" y1="-10" x2="0" y2="-108"/>
      <line x1="560" y1="-10" x2="560" y2="-108"/>
      <line x1="130" y1="-52" x2="430" y2="-52" marker-start="url(#flecha)" marker-end="url(#flecha)"/>
      <line x1="0" y1="-98" x2="560" y2="-98" marker-start="url(#flecha)" marker-end="url(#flecha)"/>
      <line x1="-120" y1="0" x2="-20" y2="0"/>
      <line x1="-120" y1="320" x2="-20" y2="320"/>
      <line x1="-110" y1="0" x2="-110" y2="185" marker-start="url(#flecha)"/>
      <line x1="-110" y1="232" x2="-110" y2="320" marker-end="url(#flecha)"/>
    </g>
  </g>

  <!-- textos de la vista lateral (en px) -->
  <g font-size="14" fill="#1E2A1F">
    <text x="414" y="152" text-anchor="middle" font-weight="600">300 entre ejes</text>
    <text x="414" y="114" text-anchor="middle" font-weight="600">560</text>
    <text x="102" y="300" text-anchor="middle" font-weight="600" transform="rotate(-90 102 300)">320</text>
    <text x="548" y="186" text-anchor="middle" font-weight="700">A</text>
    <text x="548" y="482" text-anchor="middle" font-weight="700">A</text>
  </g>
  <g font-size="13" fill="#1E2A1F">
    <line x1="595" y1="218" x2="760" y2="190" stroke="#1F6B3A" stroke-width="1.2"/>
    <text x="766" y="186">Garrucha Ø 200</text>
    <text x="766" y="203" fill="#55624F">(línea punteada: oculta)</text>
    <line x1="702" y1="364" x2="760" y2="250" stroke="#1F6B3A" stroke-width="1.2"/>
    <text x="766" y="250">Cable portante 5/8"</text>
    <line x1="752" y1="436" x2="770" y2="440" stroke="#1F6B3A" stroke-width="1.2"/>
    <text x="776" y="438">Al winche: cable tractor</text>
    <text x="776" y="455" fill="#55624F">con grillete 1/2" y destorcedor</text>
    <line x1="166" y1="424" x2="130" y2="470" stroke="#1F6B3A" stroke-width="1.2"/>
    <text x="40" y="490">Oreja de tiro en cada</text>
    <text x="40" y="507">extremo, agujero Ø 18</text>
    <line x1="534" y1="390" x2="610" y2="520" stroke="#1F6B3A" stroke-width="1.2"/>
    <text x="616" y="530">Pasador antidescarrilamiento</text>
    <text x="616" y="547" fill="#55624F">bajo cada garrucha</text>
    <line x1="402" y1="426" x2="300" y2="540" stroke="#1F6B3A" stroke-width="1.2"/>
    <text x="160" y="556">Perno de carga M24</text>
    <line x1="470" y1="536" x2="520" y2="586" stroke="#1F6B3A" stroke-width="1.2"/>
    <text x="526" y="596">Gancho giratorio con seguro</text>
  </g>

  <line x1="30" y1="630" x2="970" y2="630" stroke="#CFD3C4" stroke-width="1.5"/>
  <text x="30" y="668" font-size="16" font-weight="700" fill="#1E2A1F">Corte A–A (por el eje de una garrucha)</text>

  <!-- corte: 1 mm = 1 px, x = 0 en el centro del cable -->
  <g transform="translate(200 740)">
    <!-- placas -->
    <rect x="-38" y="0" width="8" height="320" fill="#DDE3D6" stroke="#1E2A1F" stroke-width="2"/>
    <rect x="30" y="0" width="8" height="320" fill="#DDE3D6" stroke="#1E2A1F" stroke-width="2"/>
    <!-- garrucha con canal arriba y abajo -->
    <path d="M-22.5,8 L-8.5,8 A8.5,8.5 0 0 0 8.5,8 L22.5,8 L22.5,208 L8.5,208 A8.5,8.5 0 0 0 -8.5,208 L-22.5,208 Z" fill="#EEF0EA" stroke="#1E2A1F" stroke-width="2"/>
    <rect x="-22.5" y="93" width="45" height="30" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="1.5"/>
    <!-- eje M20 con tubos separadores -->
    <rect x="-56" y="98" width="112" height="20" fill="#FFFFFF" stroke="#1E2A1F" stroke-width="2"/>
    <rect x="-30" y="95" width="7.5" height="26" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="1.5"/>
    <rect x="22.5" y="95" width="7.5" height="26" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="1.5"/>
    <rect x="-70" y="92" width="14" height="32" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="2"/>
    <rect x="38" y="92" width="16" height="32" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="2"/>
    <!-- cable portante -->
    <circle cx="0" cy="208" r="8" fill="#4A4F47"/>
    <!-- pasador antidescarrilamiento -->
    <rect x="-52" y="229" width="104" height="14" fill="#FFFFFF" stroke="#1E2A1F" stroke-width="2"/>
    <rect x="-30" y="226" width="60" height="20" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="1.5"/>
    <rect x="-64" y="224" width="12" height="24" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="2"/>
    <rect x="38" y="224" width="14" height="24" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="2"/>
    <!-- perno de carga y ojo del gancho -->
    <rect x="-24" y="258" width="48" height="72" rx="22" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="2"/>
    <rect x="-58" y="270" width="116" height="24" fill="#FFFFFF" stroke="#1E2A1F" stroke-width="2"/>
    <rect x="-74" y="264" width="16" height="36" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="2"/>
    <rect x="38" y="264" width="18" height="36" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="2"/>
    <rect x="-14" y="330" width="28" height="28" rx="3" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="2"/>
    <!-- cota de holgura -->
    <g stroke="#C2410C" stroke-width="1.5">
      <line x1="-90" y1="216" x2="-12" y2="216"/>
      <line x1="-90" y1="226" x2="-34" y2="226"/>
      <line x1="-84" y1="196" x2="-84" y2="216" marker-end="url(#flecha)"/>
      <line x1="-84" y1="246" x2="-84" y2="226" marker-end="url(#flecha)"/>
    </g>
    <text x="-92" y="225" font-size="13" font-weight="700" fill="#C2410C" text-anchor="end">10</text>
    <!-- cota separación placas -->
    <g stroke="#1E2A1F" stroke-width="1.5">
      <line x1="-30" y1="-4" x2="-30" y2="-30"/>
      <line x1="30" y1="-4" x2="30" y2="-30"/>
      <line x1="-30" y1="-22" x2="30" y2="-22" marker-start="url(#flecha)" marker-end="url(#flecha)"/>
    </g>
    <text x="0" y="-30" font-size="13" font-weight="700" fill="#1E2A1F" text-anchor="middle">60 libre</text>
  </g>

  <!-- etiquetas del corte -->
  <g font-size="14" fill="#1E2A1F">
    <line x1="238" y1="780" x2="330" y2="752" stroke="#1F6B3A" stroke-width="1.2"/>
    <text x="336" y="748" font-weight="600">Placas de acero A36 de 8 mm</text>
    <text x="336" y="766" fill="#55624F">La derecha se desmonta para montar el carro en cualquier punto del cable.</text>
    <line x1="215" y1="800" x2="330" y2="800" stroke="#1F6B3A" stroke-width="1.2"/>
    <text x="336" y="796" font-weight="600">Garrucha Ø 200 mm, ancho 45, canal para cable 5/8"</text>
    <text x="336" y="814" fill="#55624F">Con dos rodamientos sellados 6204-2RS. Capacidad mínima 1 t cada una.</text>
    <line x1="256" y1="848" x2="330" y2="848" stroke="#1F6B3A" stroke-width="1.2"/>
    <text x="336" y="844" font-weight="600">Eje: perno M20 grado 8.8, tuerca de seguridad</text>
    <text x="336" y="862" fill="#55624F">Tubos separadores entre garrucha y placas.</text>
    <line x1="208" y1="948" x2="330" y2="896" stroke="#1F6B3A" stroke-width="1.2"/>
    <text x="336" y="900" font-weight="600">Cable portante 5/8"</text>
    <line x1="252" y1="976" x2="330" y2="944" stroke="#1F6B3A" stroke-width="1.2"/>
    <text x="336" y="940" font-weight="600">Pasador antidescarrilamiento: perno M16 con tubo</text>
    <text x="336" y="958" fill="#55624F">Deja 10 mm bajo el cable: menos que su grosor, así el cable no se sale.</text>
    <line x1="256" y1="1022" x2="330" y2="992" stroke="#1F6B3A" stroke-width="1.2"/>
    <text x="336" y="988" font-weight="600">Perno de carga M24 grado 8.8</text>
    <line x1="214" y1="1084" x2="330" y2="1036" stroke="#1F6B3A" stroke-width="1.2"/>
    <text x="336" y="1032" font-weight="600">Gancho giratorio con seguro, carga de trabajo de 1 t o más</text>
    <text x="336" y="1050" fill="#55624F">Prueba el carro terminado con 1,25 veces la carga, a 30 cm del suelo.</text>
  </g>
</svg>
