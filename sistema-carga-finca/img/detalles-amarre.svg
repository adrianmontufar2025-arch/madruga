<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Detalles de amarre, tensado y base fija</title>
  <desc id="desc">Tres detalles. Uno: ojo de cable con guardacabo cerrado con tres grapas, la silla sobre el ramal vivo y la U sobre la punta muerta. Dos: tensado en el anclaje bajo con tecle de palanca, dinamómetro y agarre de cable. Tres: corte de una base fija de hormigón enterrada a un metro y medio, con un estrobo que sale por un tubo inclinado como el cable.</desc>
  <defs>
    <marker id="cota" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#1E2A1F"/>
    </marker>
    <marker id="tiro" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" fill="#C2410C"/>
    </marker>
    <pattern id="relleno" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#B9A88C" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1000" height="1000" fill="#FFFFFF"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#1E2A1F">Detalles de amarre</text>
  <text x="30" y="64" font-size="14" fill="#55624F">Sin escala. Grapas forjadas, guardacabos y grilletes con su carga de trabajo marcada.</text>
  <line x1="20" y1="420" x2="980" y2="420" stroke="#CFD3C4" stroke-width="1.5"/>
  <line x1="500" y1="420" x2="500" y2="985" stroke="#CFD3C4" stroke-width="1.5"/>

  <!-- 1. grapas -->
  <text x="30" y="104" font-size="17" font-weight="700" fill="#1E2A1F">1. Ojo con guardacabo y grapas</text>
  <path d="M940,258 L330,258 C260,258 220,300 160,300 C105,300 105,200 160,200 C220,200 260,244 330,244 L660,244" fill="none" stroke="#4A4F47" stroke-width="13" stroke-linejoin="round"/>
  <line x1="330" y1="251" x2="660" y2="251" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M318,251 C258,251 222,287 163,287 C121,287 121,213 163,213 C222,213 258,251 318,251 Z" fill="none" stroke="#9AA48F" stroke-width="7"/>
  <g>
    <path d="M355,268 L355,236 A15,15 0 0 1 385,236 L385,268" fill="none" stroke="#1E2A1F" stroke-width="5"/>
    <rect x="348" y="265" width="44" height="12" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="1.5"/>
    <rect x="349" y="277" width="12" height="10" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="1.5"/>
    <rect x="379" y="277" width="12" height="10" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="1.5"/>
  </g>
  <g>
    <path d="M475,268 L475,236 A15,15 0 0 1 505,236 L505,268" fill="none" stroke="#1E2A1F" stroke-width="5"/>
    <rect x="468" y="265" width="44" height="12" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="1.5"/>
    <rect x="469" y="277" width="12" height="10" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="1.5"/>
    <rect x="499" y="277" width="12" height="10" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="1.5"/>
  </g>
  <g>
    <path d="M595,268 L595,236 A15,15 0 0 1 625,236 L625,268" fill="none" stroke="#1E2A1F" stroke-width="5"/>
    <rect x="588" y="265" width="44" height="12" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="1.5"/>
    <rect x="589" y="277" width="12" height="10" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="1.5"/>
    <rect x="619" y="277" width="12" height="10" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="1.5"/>
  </g>
  <!-- marca de pintura -->
  <rect x="650" y="251" width="8" height="14" fill="#C2410C"/>
  <!-- cotas -->
  <g stroke="#1E2A1F" stroke-width="1.5">
    <line x1="318" y1="236" x2="318" y2="160"/>
    <line x1="660" y1="236" x2="660" y2="160"/>
    <line x1="318" y1="170" x2="660" y2="170" marker-start="url(#cota)" marker-end="url(#cota)"/>
    <line x1="370" y1="292" x2="370" y2="324"/>
    <line x1="490" y1="292" x2="490" y2="324"/>
    <line x1="370" y1="316" x2="490" y2="316" marker-start="url(#cota)" marker-end="url(#cota)"/>
  </g>
  <g font-size="13" fill="#1E2A1F">
    <text x="489" y="160" text-anchor="middle" font-weight="700">Largo doblado: 30 cm en 5/8" · 14 cm en 5/16"</text>
    <text x="430" y="340" text-anchor="middle" font-weight="700">6 diámetros</text>
    <text x="430" y="356" text-anchor="middle">(≈ 10 cm en 5/8")</text>
    <line x1="490" y1="221" x2="530" y2="196" stroke="#1F6B3A" stroke-width="1.2"/>
    <text x="536" y="200" font-weight="700">U sobre la punta muerta</text>
    <line x1="625" y1="287" x2="690" y2="318" stroke="#1F6B3A" stroke-width="1.2"/>
    <text x="696" y="314" font-weight="700">Silla sobre el ramal vivo</text>
    <text x="696" y="330">(el que trabaja)</text>
    <line x1="140" y1="250" x2="96" y2="342" stroke="#1F6B3A" stroke-width="1.2"/>
    <text x="40" y="358" font-weight="700">Guardacabo</text>
    <line x1="654" y1="266" x2="690" y2="282" stroke="#C2410C" stroke-width="1.2"/>
    <text x="696" y="282" fill="#C2410C" font-weight="700">Marca de pintura</text>
    <text x="760" y="240" fill="#55624F">ramal vivo →</text>
  </g>
  <g font-size="13" fill="#1E2A1F">
    <text x="30" y="392">5/8": 3 grapas (mejor 4), apriete 130 N·m · 5/16": 2 grapas (mejor 3), apriete 40 N·m. Reaprieta tras la primera carga y cada semana.</text>
  </g>

  <!-- 2. tensado -->
  <text x="30" y="454" font-size="17" font-weight="700" fill="#1E2A1F">2. Tensado en el anclaje bajo</text>
  <g font-size="13" fill="#1E2A1F">
    <text x="30" y="480"><tspan font-weight="700">1</tspan>  Tecle a la eslinga, agarre al cable, dinamómetro en medio.</text>
    <text x="30" y="499"><tspan font-weight="700">2</tspan>  Tensa hasta la lectura de la calculadora. Ni un kilo más.</text>
    <text x="30" y="518"><tspan font-weight="700">3</tspan>  Con la tensión puesta, forma el ojo con guardacabo</text>
    <text x="48" y="535">en el grillete y pon las grapas.</text>
    <text x="30" y="554"><tspan font-weight="700">4</tspan>  Afloja el tecle despacio y retira el equipo.</text>
  </g>
  <rect x="20" y="900" width="470" height="40" fill="#EDE6D8"/>
  <line x1="20" y1="900" x2="490" y2="900" stroke="#8B6B4A" stroke-width="2"/>
  <rect x="40" y="610" width="46" height="290" fill="#7A5A3A"/>
  <path d="M36,616 l10,-8 l10,8 l10,-8 l10,8 l10,-8 l8,6" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <ellipse cx="63" cy="862" rx="28" ry="8" fill="none" stroke="#1F6B3A" stroke-width="5"/>
  <circle cx="100" cy="862" r="8" fill="#FFFFFF" stroke="#1E2A1F" stroke-width="3"/>
  <!-- cable portante tensado -->
  <path d="M490,770 L322,826" fill="none" stroke="#4A4F47" stroke-width="7"/>
  <!-- punta floja que formará el ojo -->
  <path d="M300,834 L112,858" fill="none" stroke="#4A4F47" stroke-width="5" stroke-dasharray="10 6"/>
  <!-- agarre -->
  <rect x="290" y="818" width="44" height="18" rx="3" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="2" transform="rotate(-18 312 827)"/>
  <!-- tecle y dinamómetro -->
  <path d="M108,866 L146,880" stroke="#1E2A1F" stroke-width="2.5"/>
  <rect x="146" y="868" width="42" height="26" rx="4" fill="#1F6B3A"/>
  <line x1="166" y1="894" x2="156" y2="916" stroke="#1E2A1F" stroke-width="3"/>
  <path d="M188,880 L222,878" stroke="#1E2A1F" stroke-width="2.5" stroke-dasharray="3 2"/>
  <circle cx="238" cy="876" r="16" fill="#FFFFFF" stroke="#1E2A1F" stroke-width="2.5"/>
  <text x="238" y="880" font-size="10" font-weight="700" text-anchor="middle" fill="#1E2A1F">kg</text>
  <path d="M254,872 L312,838" stroke="#1E2A1F" stroke-width="2.5"/>
  <g font-size="13" fill="#1E2A1F">
    <line x1="72" y1="852" x2="110" y2="780" stroke="#1F6B3A" stroke-width="1.2"/>
    <text x="100" y="760" font-weight="700">Eslinga 5 t</text>
    <text x="100" y="776">y grillete 3/4"</text>
    <line x1="150" y1="892" x2="96" y2="920" stroke="#1F6B3A" stroke-width="1.2"/>
    <text x="34" y="934" font-weight="700">Tecle 3 t</text>
    <line x1="246" y1="892" x2="262" y2="924" stroke="#1F6B3A" stroke-width="1.2"/>
    <text x="268" y="932" font-weight="700">Dinamómetro 5 t</text>
    <line x1="320" y1="816" x2="336" y2="760" stroke="#1F6B3A" stroke-width="1.2"/>
    <text x="300" y="736" font-weight="700">Agarre para 5/8"</text>
    <text x="300" y="752" fill="#55624F">bien apretado al cable</text>
    <text x="402" y="836" fill="#55624F">cable portante →</text>
    <text x="116" y="824" fill="#55624F">punta floja: aquí va el ojo</text>
  </g>

  <!-- 3. base fija -->
  <text x="530" y="454" font-size="17" font-weight="700" fill="#1E2A1F">3. Base fija de hormigón (corte)</text>
  <g font-size="13" fill="#1E2A1F">
    <text x="530" y="480">Viga de hormigón f'c 210 kg/cm², 2,0 × 0,40 × 0,40 m,</text>
    <text x="530" y="497">fundida contra tierra firme sin remover del lado del tiro.</text>
    <text x="530" y="514">4 varillas Ø 12 mm y estribos Ø 8 mm cada 20 cm.</text>
    <text x="530" y="531">El estrobo galvanizado de 5/8" abraza la viga por el centro</text>
    <text x="530" y="548">y se coloca antes de fundir.</text>
  </g>
  <rect x="520" y="600" width="460" height="300" fill="#EDE6D8"/>
  <path d="M590,600 L704,600 L704,840 L590,840 Z" fill="url(#relleno)" stroke="#8B6B4A" stroke-width="1.5"/>
  <path d="M700,770 L898,600 L940,600 L704,804 Z" fill="url(#relleno)" stroke="#8B6B4A" stroke-width="1.5"/>
  <line x1="520" y1="600" x2="980" y2="600" stroke="#8B6B4A" stroke-width="2"/>
  <!-- tubo pvc -->
  <path d="M706,782 L912,605" stroke="#CFD3C4" stroke-width="14" stroke-linecap="butt"/>
  <!-- viga -->
  <rect x="640" y="776" width="64" height="64" fill="#A9AEA4" stroke="#1E2A1F" stroke-width="2"/>
  <rect x="645" y="781" width="54" height="54" fill="none" stroke="#4A4F47" stroke-width="1.5"/>
  <g fill="#1E2A1F"><circle cx="651" cy="787" r="3.5"/><circle cx="693" cy="787" r="3.5"/><circle cx="651" cy="829" r="3.5"/><circle cx="693" cy="829" r="3.5"/></g>
  <!-- estrobo -->
  <path d="M708,778 L708,846 L636,846 L636,772 L708,772 L910,602" fill="none" stroke="#1F6B3A" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="918" cy="594" r="7" fill="#FFFFFF" stroke="#1E2A1F" stroke-width="3"/>
  <line x1="924" y1="589" x2="978" y2="544" stroke="#4A4F47" stroke-width="5"/>
  <line x1="930" y1="560" x2="976" y2="520" stroke="#C2410C" stroke-width="3" marker-end="url(#tiro)"/>
  <g stroke="#1E2A1F" stroke-width="1.5">
    <line x1="560" y1="600" x2="560" y2="840" marker-start="url(#cota)" marker-end="url(#cota)"/>
    <line x1="552" y1="840" x2="636" y2="840"/>
  </g>
  <text x="548" y="726" font-size="13" font-weight="700" text-anchor="middle" fill="#1E2A1F" transform="rotate(-90 548 726)">1,5 m</text>
  <g font-size="13" fill="#1E2A1F">
    <line x1="704" y1="808" x2="760" y2="842" stroke="#1F6B3A" stroke-width="1.2"/>
    <text x="766" y="846" font-weight="700">Tierra firme</text>
    <text x="766" y="862">sin remover</text>
    <line x1="806" y1="694" x2="840" y2="720" stroke="#1F6B3A" stroke-width="1.2"/>
    <text x="846" y="726" font-weight="700">Tubo PVC 2"</text>
    <text x="846" y="742">con grasa,</text>
    <text x="846" y="758">inclinado</text>
    <text x="846" y="774">como el cable</text>
    <text x="600" y="866" font-weight="700">0,40 × 0,40</text>
  </g>
  <g font-size="13" fill="#1E2A1F">
    <text x="530" y="928" font-weight="700">Carga de trabajo ≈ 3,8 t en suelo firme (la mitad si es blando).</text>
    <text x="530" y="946">Espera 14 días de fraguado antes de la prueba de carga.</text>
    <text x="530" y="964">Prueba obligatoria: 1,25 veces la tensión máxima, 10 minutos.</text>
  </g>
</svg>
