<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Anclajes portátiles</title>
  <desc id="desc">Cuatro formas de anclar el sistema: a un árbol vivo con protector y eslinga a ras del suelo; con un muerto enterrado, un tronco a un metro y medio de profundidad apoyado contra tierra firme; con un grupo de estacas tres-dos-uno inclinadas contra el tiro y amarradas entre sí; y con anclas de tornillo que se atornillan en línea con el cable.</desc>
  <defs>
    <marker id="tiro" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" fill="#C2410C"/>
    </marker>
    <marker id="cota" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#1E2A1F"/>
    </marker>
    <pattern id="relleno" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#B9A88C" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1000" height="900" fill="#FFFFFF"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#1E2A1F">Anclajes portátiles</text>
  <text x="30" y="64" font-size="14" fill="#55624F">La flecha roja es el tiro del cable. Prueba cada anclaje con 1,25 veces la tensión máxima de la calculadora antes de usarlo.</text>
  <line x1="500" y1="90" x2="500" y2="880" stroke="#CFD3C4" stroke-width="1.5"/>
  <line x1="20" y1="480" x2="980" y2="480" stroke="#CFD3C4" stroke-width="1.5"/>

  <!-- 1. árbol -->
  <text x="30" y="110" font-size="17" font-weight="700" fill="#1E2A1F">1. Árbol vivo</text>
  <rect x="20" y="350" width="460" height="110" fill="#EDE6D8"/>
  <line x1="20" y1="350" x2="480" y2="350" stroke="#8B6B4A" stroke-width="2"/>
  <path d="M120,350 L120,200 L170,200 L170,350 Z" fill="#7A5A3A"/>
  <path d="M120,350 C110,365 95,375 80,380 M170,350 C182,366 198,374 215,378 M145,350 L145,385" fill="none" stroke="#7A5A3A" stroke-width="6" stroke-linecap="round"/>
  <circle cx="145" cy="180" r="50" fill="#5E8F5A"/>
  <circle cx="106" cy="206" r="28" fill="#5E8F5A"/>
  <circle cx="184" cy="206" r="28" fill="#5E8F5A"/>
  <!-- protector de tablas -->
  <g fill="#D7B98A" stroke="#7A5A3A" stroke-width="1.5">
    <rect x="114" y="300" width="9" height="44"/>
    <rect x="126" y="300" width="9" height="44"/>
    <rect x="155" y="300" width="9" height="44"/>
    <rect x="167" y="300" width="9" height="44"/>
  </g>
  <ellipse cx="145" cy="322" rx="34" ry="9" fill="none" stroke="#1F6B3A" stroke-width="5"/>
  <circle cx="186" cy="324" r="7" fill="#FFFFFF" stroke="#1E2A1F" stroke-width="3"/>
  <line x1="193" y1="324" x2="420" y2="300" stroke="#1E2A1F" stroke-width="4"/>
  <line x1="350" y1="276" x2="440" y2="266" stroke="#C2410C" stroke-width="3" marker-end="url(#tiro)"/>
  <!-- cota altura de amarre -->
  <g stroke="#1E2A1F" stroke-width="1.5">
    <line x1="70" y1="322" x2="108" y2="322"/>
    <line x1="80" y1="322" x2="80" y2="350" marker-start="url(#cota)" marker-end="url(#cota)"/>
  </g>
  <text x="74" y="342" font-size="12" font-weight="700" text-anchor="end" fill="#1E2A1F">≤ 50 cm</text>
  <g font-size="13" fill="#1E2A1F">
    <text x="230" y="140" font-weight="700">Ø 40 cm o más para el portante</text>
    <text x="230" y="158">Ø 25 cm o más para el winche y poleas</text>
    <text x="230" y="186">Sano, sin huecos ni podredumbre,</text>
    <text x="230" y="204">con raíces firmes. No al borde</text>
    <text x="230" y="222">de un barranco ni en suelo flojo.</text>
    <text x="230" y="250">Protector de tablas o eslinga ancha</text>
    <text x="230" y="268">para no pelar la corteza.</text>
    <text x="30" y="400" font-weight="700">Amarra lo más bajo posible.</text>
    <text x="30" y="418">Si dudas del árbol, amárralo hacia atrás a otro árbol</text>
    <text x="30" y="436">(anclaje en tándem) para repartir la fuerza.</text>
  </g>

  <!-- 2. muerto enterrado -->
  <text x="530" y="110" font-size="17" font-weight="700" fill="#1E2A1F">2. Muerto enterrado (corte)</text>
  <path d="M520,180 L980,180 L980,460 L520,460 Z" fill="#EDE6D8"/>
  <!-- zanja rellena (lado opuesto al tiro) -->
  <path d="M600,180 L668,180 L668,374 L600,374 Z" fill="url(#relleno)" stroke="#8B6B4A" stroke-width="1.5"/>
  <!-- ranura inclinada hacia el tiro -->
  <path d="M668,330 L800,180 L824,180 L690,346 Z" fill="url(#relleno)" stroke="#8B6B4A" stroke-width="1.5"/>
  <line x1="520" y1="180" x2="980" y2="180" stroke="#8B6B4A" stroke-width="2"/>
  <!-- tronco -->
  <circle cx="650" cy="350" r="22" fill="#7A5A3A" stroke="#4E3A26" stroke-width="2"/>
  <circle cx="650" cy="350" r="12" fill="none" stroke="#9C7A55" stroke-width="2"/>
  <!-- estrobo -->
  <path d="M650,328 C672,326 676,340 672,350 L812,182" fill="none" stroke="#1F6B3A" stroke-width="4"/>
  <path d="M650,372 C674,372 680,360 672,350" fill="none" stroke="#1F6B3A" stroke-width="4"/>
  <circle cx="818" cy="174" r="7" fill="#FFFFFF" stroke="#1E2A1F" stroke-width="3"/>
  <line x1="825" y1="170" x2="960" y2="110" stroke="#1E2A1F" stroke-width="4"/>
  <line x1="880" y1="112" x2="966" y2="74" stroke="#C2410C" stroke-width="3" marker-end="url(#tiro)"/>
  <!-- cota de profundidad -->
  <g stroke="#1E2A1F" stroke-width="1.5">
    <line x1="560" y1="180" x2="560" y2="350" marker-start="url(#cota)" marker-end="url(#cota)"/>
    <line x1="552" y1="350" x2="626" y2="350"/>
  </g>
  <text x="548" y="270" font-size="13" font-weight="700" text-anchor="middle" fill="#1E2A1F" transform="rotate(-90 548 270)">1,2 a 1,5 m</text>
  <g font-size="13" fill="#1E2A1F">
    <text x="704" y="380" font-weight="700">Tierra firme sin remover</text>
    <text x="704" y="398">del lado del tiro: ahí se apoya</text>
    <text x="704" y="416">todo el esfuerzo.</text>
    <text x="840" y="230">Ranura alineada</text>
    <text x="840" y="248">con el cable</text>
    <text x="530" y="410" font-weight="700">Tronco de madera dura</text>
    <text x="530" y="428">Ø 30 cm × 2 m, o riel o tubo</text>
    <text x="530" y="446">Relleno compactado por capas.</text>
    <text x="530" y="132">Estrobo de cable galvanizado 5/8"</text>
    <text x="530" y="149">abrazando el tronco, con guardacabo</text>
    <text x="530" y="166">y grillete. El ojo queda fuera del suelo.</text>
  </g>

  <!-- 3. estacas 3-2-1 -->
  <text x="30" y="510" font-size="17" font-weight="700" fill="#1E2A1F">3. Grupo de estacas 3-2-1</text>
  <rect x="20" y="640" width="460" height="120" fill="#EDE6D8"/>
  <line x1="20" y1="640" x2="480" y2="640" stroke="#8B6B4A" stroke-width="2"/>
  <!-- estacas inclinadas 15° contra el tiro (tiro hacia la derecha) -->
  <g stroke="#4A4F47" stroke-width="7" stroke-linecap="round">
    <line x1="92" y1="610" x2="120" y2="725"/>
    <line x1="212" y1="610" x2="240" y2="725"/>
    <line x1="332" y1="610" x2="360" y2="725"/>
  </g>
  <!-- amarres: cabeza de la delantera al pie de la siguiente -->
  <g stroke="#1F6B3A" stroke-width="3" fill="none">
    <path d="M332,614 L215,636"/>
    <path d="M332,620 L216,640"/>
    <path d="M212,614 L95,636"/>
    <path d="M212,620 L96,640"/>
  </g>
  <line x1="338" y1="618" x2="440" y2="608" stroke="#1E2A1F" stroke-width="4"/>
  <line x1="400" y1="590" x2="470" y2="583" stroke="#C2410C" stroke-width="3" marker-end="url(#tiro)"/>
  <g font-size="13" font-weight="700" fill="#1E2A1F" text-anchor="middle">
    <text x="104" y="596">1 estaca</text>
    <text x="224" y="596">2 estacas</text>
    <text x="344" y="596">3 estacas</text>
  </g>
  <g stroke="#1E2A1F" stroke-width="1.5">
    <line x1="120" y1="745" x2="240" y2="745" marker-start="url(#cota)" marker-end="url(#cota)"/>
    <line x1="240" y1="745" x2="360" y2="745" marker-start="url(#cota)" marker-end="url(#cota)"/>
  </g>
  <text x="180" y="739" font-size="12" font-weight="700" text-anchor="middle" fill="#1E2A1F">1 m</text>
  <text x="300" y="739" font-size="12" font-weight="700" text-anchor="middle" fill="#1E2A1F">1 m</text>
  <g font-size="13" fill="#1E2A1F">
    <text x="30" y="540">Estacas de tubo 1½" o ángulo 2" de 1,2 m, enterradas</text>
    <text x="30" y="558">0,9 m e inclinadas unos 15° hacia atrás, contra el tiro.</text>
    <text x="30" y="784" font-weight="700">≈ 900 kg de trabajo en suelo común; en arena, la mitad.</text>
    <text x="30" y="802">Sirve para el amarre trasero del winche y las poleas de desvío.</text>
    <text x="30" y="820" font-weight="700" fill="#B3261E">Nunca para el cable portante.</text>
    <text x="30" y="846">Amarre: cabeza de la estaca delantera al pie de la siguiente,</text>
    <text x="30" y="864">con 4 vueltas de soga o cable, tensado con un palo (torniquete).</text>
  </g>

  <!-- 4. ancla de tornillo -->
  <text x="530" y="510" font-size="17" font-weight="700" fill="#1E2A1F">4. Ancla de tornillo</text>
  <rect x="520" y="620" width="460" height="200" fill="#EDE6D8"/>
  <line x1="520" y1="620" x2="980" y2="620" stroke="#8B6B4A" stroke-width="2"/>
  <!-- dos anclas en línea con el tiro -->
  <g>
    <line x1="700" y1="606" x2="612" y2="780" stroke="#4A4F47" stroke-width="7"/>
    <ellipse cx="626" cy="752" rx="30" ry="9" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="2" transform="rotate(27 626 752)"/>
    <ellipse cx="641" cy="722" rx="26" ry="8" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="2" transform="rotate(27 641 722)"/>
    <circle cx="704" cy="598" r="9" fill="#FFFFFF" stroke="#1E2A1F" stroke-width="3"/>
  </g>
  <g>
    <line x1="800" y1="606" x2="712" y2="780" stroke="#4A4F47" stroke-width="7"/>
    <ellipse cx="726" cy="752" rx="30" ry="9" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="2" transform="rotate(27 726 752)"/>
    <ellipse cx="741" cy="722" rx="26" ry="8" fill="#B7C0AE" stroke="#1E2A1F" stroke-width="2" transform="rotate(27 741 722)"/>
    <circle cx="804" cy="598" r="9" fill="#FFFFFF" stroke="#1E2A1F" stroke-width="3"/>
  </g>
  <!-- eslinga que reparte entre las dos -->
  <path d="M712,596 L840,580 L812,596" fill="none" stroke="#1F6B3A" stroke-width="4"/>
  <circle cx="846" cy="578" r="7" fill="#FFFFFF" stroke="#1E2A1F" stroke-width="3"/>
  <line x1="853" y1="575" x2="960" y2="530" stroke="#1E2A1F" stroke-width="4"/>
  <line x1="880" y1="540" x2="966" y2="504" stroke="#C2410C" stroke-width="3" marker-end="url(#tiro)"/>
  <g font-size="13" fill="#1E2A1F">
    <text x="530" y="534">Ancla de tornillo de retenida de poste:</text>
    <text x="530" y="551">hélice de 20–25 cm y varilla de 5/8" a 3/4"</text>
    <text x="530" y="568">de 1,5–2 m. Se atornilla con una barra.</text>
    <text x="830" y="660" font-weight="700">Instálala inclinada,</text>
    <text x="830" y="678">en línea con el cable.</text>
    <text x="830" y="710">Usa 2 o 3 juntas,</text>
    <text x="830" y="728">con eslinga que</text>
    <text x="830" y="746">reparta la fuerza.</text>
    <text x="530" y="844" font-weight="700">≈ 1 t de trabajo cada una en suelo firme (varía mucho con el suelo).</text>
    <text x="530" y="862">Es la más portátil: se saca desatornillando.</text>
    <text x="530" y="880">Pruébala siempre antes de usarla.</text>
  </g>
</svg>
